<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto Premium</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #0b1020;
  color: #fff;
  font-family: Arial, sans-serif;
  padding: 20px;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
  border-radius: 9px;
  padding: 12px 18px;
  font-weight: bold;
}

.container {
  width: 100%;
  max-width: 480px;
  margin: 90px auto 30px;
  background: #131d32;
  padding: 25px;
  border-radius: 16px;
  border: 1px solid #26334d;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
  color: #55e6ff;
}

.subtitle {
  text-align: center;
  color: #9ba9c2;
  font-size: 14px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #34435f;
  border-radius: 9px;
  background: #0b1020;
  color: white;
  outline: none;
  margin-bottom: 14px;
}

input:focus {
  border-color: #55e6ff;
}

.primary {
  width: 100%;
  background: #55e6ff;
  color: #07111d;
}

.secondary {
  background: #26334d;
  color: white;
}

#photoSection {
  display: none;
  margin-top: 25px;
  text-align: center;
}

#photo {
  display: block;
  width: 100%;
  max-height: 600px;
  object-fit: contain;
  border-radius: 12px;
  background: #080d18;
  cursor: zoom-in;
  margin-bottom: 15px;
}

.actions {
  display: flex;
  gap: 10px;
}

.actions button {
  flex: 1;
}

#clientMessage {
  margin-top: 15px;
  text-align: center;
  font-size: 14px;
  color: #55e6ff;
  overflow-wrap: anywhere;
}

#zoomView {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(0,0,0,.95);
  align-items: center;
  justify-content: center;
  padding: 15px;
}

#zoomView img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
}

#zoomClose {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #26334d;
  color: white;
}
</style>
</head>

<body>

<!-- HALAMAN CLIENT -->
<div class="container" id="clientPanel">
  <h1>Foto Premium</h1>
  <p class="subtitle">Masukkan kode akses untuk membuka foto</p>

  <input
    type="text"
    id="accessCode"
    placeholder="Masukkan 6 digit kode"
    maxlength="6"
    inputmode="numeric"
  >

  <button class="primary" id="openButton">
    Buka Foto
  </button>

  <p id="clientMessage"></p>

  <div id="photoSection">
    <img id="photo" alt="Foto premium">

    <div class="actions">
      <button class="secondary" id="zoomButton">
        Perbesar
      </button>

      <button class="primary" id="downloadButton">
        Download
      </button>
    </div>
  </div>
</div>

<!-- TAMPILAN ZOOM -->
<div id="zoomView">
  <button id="zoomClose">Tutup</button>
  <img id="zoomImage" alt="Foto diperbesar">
</div>

<!-- DATA KODE DAN NAMA FILE FOTO -->
<script type="application/json" id="photo-data">
{
  "482916": "alyanocalor.jpg",
  "731054": "ninocalor.jpg",
  "111001": "alya1calor.jpg",
  "111002": "alya2calor.jpg",
  "111003": "alya2nocalor.jpg",
  "111004": "ellennocalor.jpg",
  "111005": "Evernightcalor.jpg",
  "111006": "evernightnocolor.jpg",
  "111007": "furinacalor.jpg",
  "111008": "hutaocalor.png",
  "111009": "mambocalor.jpg",
  "111010": "mambonocalor.jpg",
  "111011": "masyacalor.png",
  "111012": "sihirhonkaicalor.jpg",
  "111013": "waguricalor.jpg",
  "111014": "yukanocalor.jpg"
}
</script>

<script>
const accessCode = document.getElementById("accessCode");
const clientMessage = document.getElementById("clientMessage");
const photo = document.getElementById("photo");
const photoSection = document.getElementById("photoSection");

const photoCodes = JSON.parse(
  document.getElementById("photo-data").textContent
);

let currentPhoto = "";

document.getElementById("openButton").addEventListener("click", () => {
  const code = accessCode.value.trim();

  if (!/^\d{6}$/.test(code)) {
    clientMessage.textContent = "Kode harus terdiri dari 6 digit.";
    photoSection.style.display = "none";
    return;
  }

  const filename = photoCodes[code];

  if (!filename) {
    clientMessage.textContent = "Kode foto tidak ditemukan.";
    photoSection.style.display = "none";
    return;
  }

  photo.onload = () => {
    currentPhoto = filename;
    photoSection.style.display = "block";
    clientMessage.textContent = "Foto berhasil dibuka.";
  };

  photo.onerror = () => {
    photoSection.style.display = "none";
    clientMessage.textContent = "File foto fisik tidak ditemukan di folder.";
  };

  photo.src = filename;
});

function openZoom() {
  document.getElementById("zoomImage").src = photo.src;
  document.getElementById("zoomView").style.display = "flex";
}

document.getElementById("zoomButton").addEventListener("click", openZoom);
photo.addEventListener("click", openZoom);

document.getElementById("zoomClose").addEventListener("click", () => {
  document.getElementById("zoomView").style.display = "none";
});

document.getElementById("downloadButton").addEventListener("click", () => {
  if (!currentPhoto) return;

  const link = document.createElement("a");
  link.href = currentPhoto;
  link.download = currentPhoto.split("/").pop();
  document.body.appendChild(link);
  link.click();
  link.remove();
});
</script>

</body>
</html>
